<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#040812">
  <title data-i18n="app_title">قطرة | QATRA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040812; --surface: rgba(15, 25, 45, 0.6); --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff; --muted: #8d9bb7; --cyan: #00d2ff; --blue: #4da6ff; --purple: #9b51e0;
    }
    body.light-mode {
      --bg: #f4f7f9; --surface: rgba(255, 255, 255, 0.8); --border: rgba(0, 0, 0, 0.08);
      --text: #040812; --muted: #5a6b8c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Cairo", sans-serif; transition: background 0.4s ease, color 0.4s ease;
      background-image: radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05), transparent 40%), radial-gradient(circle at 90% 80%, rgba(155, 81, 224, 0.05), transparent 40%);
      background-attachment: fixed;
    }
    .app { max-width: 560px; margin: auto; padding: 20px 20px 110px; }
    
    /* شاشة الإقلاع */
    #splash { position: fixed; inset: 0; background: #040812; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease; }
    .splash-drop { width: 80px; height: 80px; border-radius: 0 50% 50% 50%; background: linear-gradient(135deg, #00d2ff, #4da6ff); transform: rotate(45deg); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(45deg) scale(1.1); box-shadow: 0 0 30px rgba(0,210,255,0.5); } }

    /* القائمة الجانبية الزجاجية */
    .sidebar { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(10, 15, 25, 0.65); backdrop-filter: blur(25px); border-left: 1px solid var(--border); z-index: 1000; transition: right 0.4s ease; padding: 30px 20px; display: flex; flex-direction: column; }
    .sidebar.open { right: 0; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .sidebar-overlay.show { opacity: 1; pointer-events: all; }
    .menu-item { background: none; border: none; color: var(--text); font-size: 16px; font-weight: 600; text-align: right; padding: 15px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; width: 100%; }

    /* الواجهة */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .hamburger { background: none; border: none; color: var(--text); font-size: 28px; }
    .glass-card { background: var(--surface); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
    
    .quote-display { font-size: 20px; font-weight: 800; line-height: 1.8; text-align: center; margin: 20px 0; }
    .btn-primary { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #000; font-size: 15px; font-weight: 800; box-shadow: 0 10px 20px rgba(0,210,255,0.2); }
    
    select, input[type="time"] { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); color: var(--text); border: 1px solid var(--border); border-radius: 14px; font-family: inherit; margin-top: 5px;}
    .toggle { width: 46px; height: 26px; position: relative; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; border-radius: 30px; background: rgba(255,255,255,0.1); transition: 0.3s; }
    .toggle-track::before { content: ""; position: absolute; width: 20px; height: 20px; right: 3px; top: 3px; border-radius: 50%; background: #fff; transition: 0.3s; }
    .toggle input:checked + .toggle-track { background: var(--cyan); }
    .toggle input:checked + .toggle-track::before { transform: translateX(-20px); }

    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; display: flex; justify-content: space-around; padding: 12px 10px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); backdrop-filter: blur(20px); border-top: 1px solid var(--border); border-radius: 30px 30px 0 0; z-index: 100;}
    .nav-item { border: none; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
    .nav-item.active { color: var(--cyan); }

    .view { display: none; animation: fadeIn 0.4s ease; padding-bottom: 30px;}
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-drop"></div>
    <h1 style="color:white; margin-top:30px; font-size:32px;">قطرة</h1>
    <p style="color:#00d2ff; letter-spacing:2px;">Q A T R A</p>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <button id="closeSidebar" style="background:none; border:none; color:white; font-size:30px; text-align:left; margin-bottom:20px;">×</button>
    <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
      <span data-i18n="glass_mode">تأثير الزجاج 💎</span>
      <label class="toggle"><input type="checkbox" id="glassToggle"><span class="toggle-track"></span></label>
    </div>
    <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
      <span data-i18n="dark_mode">الوضع الداكن 🌙</span>
      <label class="toggle"><input type="checkbox" id="darkToggle"><span class="toggle-track"></span></label>
    </div>
    <button class="menu-item" id="btnLang">🌐 <span data-i18n="language">لغة التطبيق</span></button>
    <button class="menu-item" id="btnShare">📤 <span data-i18n="share">مشاركة مع صديق</span></button>
    <button class="menu-item" id="btnAbout">💡 <span data-i18n="about">حول التطبيق</span></button>
    <div style="margin-top:auto; text-align:center; color:var(--muted); font-size:12px;">Developed by<br><strong style="color:var(--cyan);">Mohammed Tijani</strong><br>V 2.0 Pro</div>
  </aside>

  <main class="app">
    <header class="topbar">
      <button class="hamburger" id="openSidebar">☰</button>
      <div style="text-align:center;">
        <div style="font-size:22px; font-weight:800; color:var(--cyan);">قطرة</div>
      </div>
      <div style="width:28px;"></div>
    </header>

    <!-- الرئيسية -->
    <section class="view active" id="homeView">
      <div class="glass-card" style="text-align:center; padding:30px 20px;">
        <div style="color:var(--cyan); font-size:12px; font-weight:700;" data-i18n="quote_of_day">اقتباس اليوم</div>
        <div class="quote-display" id="dailyQuoteText">...</div>
        <button class="btn-primary" id="triggerCinematic" data-i18n="send_drop">أرسل لي قطرة الآن ✦</button>
      </div>

      <div class="glass-card">
        <h3 style="margin-top:0;" data-i18n="activity_week">نشاط هذا الأسبوع</h3>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="display:flex; gap:8px;">
            <div style="width:20px; height:20px; border-radius:50%; background:var(--cyan);"></div>
            <div style="width:20px; height:20px; border-radius:50%; background:var(--cyan);"></div>
            <div style="width:20px; height:20px; border-radius:50%; background:var(--cyan);"></div>
            <div style="width:20px; height:20px; border-radius:50%; background:var(--border);"></div>
          </div>
          <div style="font-weight:bold; color:var(--cyan);">3/7 أيام</div>
        </div>
      </div>
    </section>

    <!-- تأمل -->
    <section class="view" id="meditationView">
      <h2 data-i18n="meditation">جلسة تركيز وهدوء</h2>
      <div class="glass-card" style="text-align:center; padding:40px 20px;">
        <div id="audioStatus" style="font-size:14px; color:var(--cyan); margin-bottom:20px;">جاهز للاسترخاء</div>
        <button class="btn-primary" id="playAudioBtn">▶ تشغيل صوت طبيعة / قرآن عشوائي</button>
      </div>
    </section>

    <!-- قطرة (الإعدادات) -->
    <section class="view" id="settingsView">
      <h2 data-i18n="settings">تخصيص قطرة</h2>
      
      <button class="btn-primary" id="previewFloatingBtn" style="margin-bottom:20px;">معاينة التأثير السينمائي الخارجي 🎬</button>

      <div class="glass-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <strong data-i18n="enable_notifications">تفعيل الإشعارات</strong>
          <label class="toggle"><input type="checkbox" id="notifToggle"><span class="toggle-track"></span></label>
        </div>
        
        <strong style="display:block; margin-bottom:10px;">تكرار الإشعارات التلقائي:</strong>
        <select id="intervalSelect">
          <option value="0">بدون تكرار (مواعيد محددة فقط)</option>
          <option value="30">كل نصف ساعة</option>
          <option value="60">كل ساعة</option>
          <option value="180">كل 3 ساعات</option>
          <option value="720">كل 12 ساعة</option>
          <option value="1440">كل 24 ساعة</option>
        </select>
      </div>

      <div class="glass-card">
        <strong style="display:block; margin-bottom:10px;">إضافة موعد محدد:</strong>
        <div style="display:flex; gap:10px;">
          <input type="time" id="customTime">
          <button class="btn-primary" id="addScheduleBtn" style="width:auto; padding:0 20px;">إضافة</button>
        </div>
        <div id="schedulesList" style="margin-top:15px;"></div>
      </div>
    </section>

    <!-- اقتباسات -->
    <section class="view" id="libraryView">
      <h2 data-i18n="library">مكتبة الإلهام</h2>
      <div id="libraryContent" style="display:grid; gap:15px;"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="homeView">🏠<span data-i18n="home">الرئيسية</span></button>
    <button class="nav-item" data-view="meditationView">🎧<span data-i18n="meditation">تأمل</span></button>
    <button class="nav-item" data-view="settingsView">💧<span data-i18n="qatra">قطرة</span></button>
    <button class="nav-item" data-view="libraryView">📖<span data-i18n="quotes">اقتباسات</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
