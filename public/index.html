<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#02050a">
  <title data-i18n="app_title">قطرة | QATRA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #02050a; --surface: rgba(10, 15, 25, 0.5); --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff; --muted: #7b8ba4; --cyan: #00e5ff; --blue: #0066ff; --purple: #a900ff;
    }
    
    /* تأثير الزجاج الحقيقي المتقدم */
    body.glass-active {
      --surface: rgba(15, 22, 40, 0.35);
      --border: rgba(255, 255, 255, 0.15);
    }
    body.glass-active .glass-panel {
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    
    body.light-mode { --bg: #eef2f6; --surface: rgba(255, 255, 255, 0.7); --text: #050a15; --border: rgba(0,0,0,0.1); --muted: #5a6b8c; }
    body.light-mode.glass-active { --surface: rgba(255,255,255,0.4); }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* شاشة ثابتة لا تتحرك */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: var(--bg); color: var(--text); font-family: "Cairo", sans-serif;
      background-image: 
        radial-gradient(circle at 15% 30%, rgba(0, 229, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(169, 0, 255, 0.1) 0%, transparent 40%);
      transition: background 0.3s ease;
    }

    .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; max-width: 500px; margin: auto; position: relative; }
    
    /* شاشة الإقلاع */
    #splash { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease; }
    .splash-drop { width: 80px; height: 80px; border-radius: 0 50% 50% 50%; background: linear-gradient(135deg, var(--cyan), var(--blue)); transform: rotate(45deg); animation: pulseDrop 2s infinite; }
    @keyframes pulseDrop { 0%, 100% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(45deg) scale(1.1); box-shadow: 0 0 30px rgba(0,229,255,0.5); } }

    /* Topbar */
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; padding: 25px 20px 10px; z-index: 10; }
    .hamburger { background: none; border: none; color: var(--text); padding: 0; cursor: pointer;}
    .hamburger svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2; }
    
    .brand { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: -5px; }
    .brand-icon { width: 36px; height: 36px; margin-bottom: 5px; }
    .brand-name { font-size: 26px; font-weight: 800; line-height: 1; }
    .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 4px; margin-top: 2px;}

    /* القائمة الجانبية */
    .sidebar { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(5, 10, 20, 0.85); backdrop-filter: blur(25px); border-left: 1px solid var(--border); z-index: 1000; transition: right 0.4s ease; padding: 30px 20px; display: flex; flex-direction: column; }
    .sidebar.open { right: 0; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .sidebar-overlay.show { opacity: 1; pointer-events: all; }

    /* منطقة المحتوى القابلة للتمرير */
    .content-area { flex: 1; overflow-y: auto; padding: 10px 20px 100px; scroll-behavior: smooth; }
    .content-area::-webkit-scrollbar { display: none; }

    .glass-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 15px; }

    /* دائرة جلسة التركيز الاحترافية (النيون) */
    .timer-wrapper {
      position: relative; width: 260px; height: 260px; margin: 10px auto 30px; border-radius: 50%; padding: 4px;
      background: conic-gradient(from 180deg, var(--cyan), var(--purple), var(--cyan));
      box-shadow: 0 0 40px rgba(169, 0, 255, 0.2); cursor: pointer;
    }
    .timer-inner {
      background: var(--bg); width: 100%; height: 100%; border-radius: 50%;
      display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
    }
    .time-display { font-size: 58px; font-weight: 800; letter-spacing: 1px; margin-top: -10px; }
    .timer-label { font-size: 15px; color: var(--muted); font-weight: 700; text-align: center; }
    
    .play-btn {
      position: absolute; bottom: 25px; width: 54px; height: 54px; border-radius: 50%; border: none;
      background: #c7e3ff; color: #02050a; display: grid; place-items: center; pointer-events: none;
    }

    /* البار السفلي الاحترافي - الرئيسية بالمنتصف */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; align-items: flex-end;
      padding: 10px 10px calc(15px + env(safe-area-inset-bottom));
      background: rgba(2, 5, 10, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border); border-radius: 35px 35px 0 0; z-index: 100;
    }
    .nav-item { border: none; background: transparent; color: var(--muted); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; cursor: pointer; }
    .nav-icon { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.active { color: #fff; }
    .nav-item.active .nav-icon { stroke: #fff; }
    
    .nav-home-btn {
      width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #0044ff, #a900ff);
      display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; border: none;
      box-shadow: 0 5px 20px rgba(169,0,255,0.4); transform: translateY(-15px); cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700;
    }
    .nav-home-btn .nav-icon { stroke: #fff; width: 28px; height: 28px; margin-bottom:2px;}

    .view { display: none; animation: fadeIn 0.3s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* الأقسام والاقتباسات */
    .category-card { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 18px; padding: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; cursor: pointer; }
    
    .btn-primary { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; margin-top:10px;}
    select, input[type="time"] { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid var(--border); border-radius: 12px; outline:none; margin-top:5px; font-family:inherit;}
    
    /* النوافذ المنبثقة (Modals) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; flex-direction: column; padding: 20px; backdrop-filter: blur(10px); }
    .modal-overlay.show { display: flex; }
    .close-modal { align-self: flex-start; background: none; border: none; color: #fff; font-size: 35px; cursor: pointer; margin-bottom: 15px; }

    /* مبيان الإحصائيات الخطي */
    .chart-container { width: 100%; height: 130px; background: rgba(0,0,0,0.2); border-radius: 12px; margin: 15px 0; position: relative; border-bottom: 2px solid var(--border); border-left: 2px solid var(--border); overflow: hidden; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;">
    <defs><linearGradient id="drop-grad" x1="12" y1="2" x2="12" y2="21"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0066ff"/></linearGradient></defs>
  </svg>

  <div id="splash">
    <div class="splash-drop"></div>
    <h1 style="color:white; margin-top:30px; font-size:32px;">قطرة</h1>
    <p style="color:#00e5ff; letter-spacing:4px;">Q A T R A</p>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <button id="closeSidebar" style="background:none; border:none; color:white; font-size:30px; text-align:left; margin-bottom:20px; cursor:pointer;">×</button>
    <div class="glass-panel" style="padding:15px; display:flex; justify-content:space-between;">
      <span data-i18n="glass_mode">تأثير الزجاج 💎</span>
      <input type="checkbox" id="glassToggle" style="width:20px;height:20px;accent-color:var(--cyan);">
    </div>
    <div class="glass-panel" style="padding:15px; display:flex; justify-content:space-between;">
      <span data-i18n="dark_mode">الوضع الداكن 🌙</span>
      <input type="checkbox" id="darkToggle" style="width:20px;height:20px;accent-color:var(--cyan);">
    </div>
    <div style="margin-bottom:15px;">
      <label style="color:var(--muted); font-size:12px;" data-i18n="language">لغة التطبيق:</label>
      <select id="langSelect">
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>
    </div>
    <button class="btn-primary" style="background:transparent; border:1px solid var(--cyan); color:var(--cyan);" data-i18n="share">📤 مشاركة التطبيق</button>
  </aside>

  <!-- نافذة البومودورو -->
  <div class="modal-overlay" id="pomodoroModal">
    <button class="close-modal" onclick="document.getElementById('pomodoroModal').classList.remove('show')">×</button>
    <h2 style="color:var(--cyan); margin-top:0;">إعداد جلسة التركيز</h2>
    <div class="glass-panel">
      <label style="color:var(--muted); font-size:13px;">مدة الجلسة (دقائق):</label>
      <select id="pomoTime">
        <option value="15">15 دقيقة</option>
        <option value="25" selected>25 دقيقة (بومودورو)</option>
        <option value="50">50 دقيقة (جلسة عميقة)</option>
      </select>
    </div>
    <div class="glass-panel">
      <label style="color:var(--muted); font-size:13px;">الصوتيات في الخلفية:</label>
      <select id="pomoAudio">
        <option value="none">بدون صوت (صمت)</option>
        <option value="https://actions.google.com/sounds/v1/water/rain_on_roof.ogg" selected>صوت المطر العذب</option>
        <option value="https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg">أمواج البحر</option>
        <option value="https://server8.mp3quran.net/afs/001.mp3">تلاوة قرآنية هادئة</option>
      </select>
    </div>
    <button class="btn-primary" id="startPomodoroBtn">بدء الجلسة في الخلفية</button>
  </div>

  <!-- نافذة محتوى قسم الاقتباسات -->
  <div class="modal-overlay" id="quotesCategoryModal">
    <button class="close-modal" onclick="document.getElementById('quotesCategoryModal').classList.remove('show')">×</button>
    <h2 style="color:var(--cyan); margin-top:0;" id="catModalTitle">القسم</h2>
    <div style="flex:1; overflow-y:auto;" id="catModalContent"></div>
  </div>

  <div class="app-container">
    <header class="topbar">
      <!-- أزرار وهمية للحفاظ على توسيط الشعار -->
      <div style="width:30px;"></div>
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 12 2 12 2C12 2 3 7.02944 3 12C3 16.9706 7.02944 21 12 21Z" fill="url(#drop-grad)"/></svg>
        <div class="brand-name" data-i18n="app_title">قطرة</div>
        <div class="brand-sub">Q A T R A</div>
      </div>
      <button class="hamburger" id="openSidebar"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    </header>

    <div class="content-area">
      <!-- 1. الرئيسية -->
      <section class="view active" id="homeView">
        <div class="timer-wrapper" onclick="document.getElementById('pomodoroModal').classList.add('show')">
          <div class="timer-inner">
            <div class="time-display" id="mainTimeDisplay">25:00</div>
            <div class="timer-label" data-i18n="focus_session">جلسة تركيز<br>وهدوء</div>
            <button class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          </div>
        </div>

        <div class="glass-panel" style="display:flex; align-items:center; gap:15px; cursor:pointer;" onclick="document.querySelector('[data-view=\'settingsView\']').click()">
          <div style="width:40px;height:40px;background:rgba(0,229,255,0.1);color:var(--cyan);display:grid;place-items:center;border-radius:12px;">
            <svg width="22" height="22" stroke="currentColor" fill="none" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div style="flex:1;">
            <div style="font-weight:800; font-size:15px;" data-i18n="upcoming_reminders">تذكيراتك القادمة</div>
            <div style="font-size:12px; color:var(--muted);" id="nextReminderText">لم تحدد مواعيد</div>
          </div>
          <div style="color:var(--muted); font-size:22px;">›</div>
        </div>

        <div class="glass-panel" style="display:flex; align-items:center; gap:15px; cursor:pointer;" id="triggerCinematic">
          <div style="width:40px;height:40px;background:rgba(169,0,255,0.1);color:var(--purple);display:grid;place-items:center;border-radius:12px;">
            <svg width="22" height="22" stroke="currentColor" fill="none" stroke-width="2"><path d="M10 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zm10 0h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zM10 11l-2 6M20 11l-2 6"/></svg>
          </div>
          <div style="flex:1;">
            <div style="font-weight:800; font-size:15px;" data-i18n="quote_of_day">اقتباس اليوم</div>
            <div style="font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="dailyQuoteText">...</div>
          </div>
          <div style="color:var(--muted); font-size:22px;">›</div>
        </div>
      </section>

      <!-- 2. تأمل -->
      <section class="view" id="meditationView">
        <h2 style="color:var(--cyan); margin-top:0;" data-i18n="meditation">تأمل واسترخاء</h2>
        <div class="glass-panel" style="text-align:center; padding:40px 20px;">
          <div id="audioStatus" style="font-size:16px; margin-bottom:20px; font-weight:bold;">محتوى عشوائي للاسترخاء</div>
          <button class="btn-primary" id="playRandomAudioBtn">▶ تشغيل الآن</button>
        </div>
      </section>

      <!-- 3. تفعيل القطرة (الإعدادات) -->
      <section class="view" id="settingsView">
        <h2 style="color:var(--cyan); margin-top:0;" data-i18n="qatra_settings">تفعيل القطرة</h2>
        
        <div class="glass-panel">
          <label style="color:var(--muted); font-size:13px;">طريقة الظهور:</label>
          <select id="notifModeSetting">
            <option value="both">إشعار نصي + قطرة مائية سينمائية</option>
            <option value="floating">القطرة المائية فقط</option>
            <option value="notification">إشعار نصي فقط</option>
          </select>
          
          <label style="color:var(--muted); font-size:13px; display:block; margin-top:15px;">مدة اختفاء القطرة المائية:</label>
          <select id="dropDurationSetting">
            <option value="5000">5 ثوانٍ</option>
            <option value="10000" selected>10 ثوانٍ</option>
            <option value="15000">15 ثانية</option>
          </select>

          <label style="color:var(--muted); font-size:13px; display:block; margin-top:15px;">التكرار التلقائي للمدد:</label>
          <select id="intervalSelect">
            <option value="0">بدون تكرار</option>
            <option value="30">كل 30 دقيقة</option>
            <option value="60">كل 1 ساعة</option>
            <option value="180">كل 3 ساعات</option>
          </select>

          <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">
            <label style="color:var(--muted); font-size:13px;">تحديد موعد مخصص بالدقيقة:</label>
            <input type="time" id="customTime">
            <button class="btn-primary" id="saveScheduleBtn" style="margin-top:10px;">حفظ الموعد</button>
          </div>
          <div id="savedSchedulesList" style="margin-top:15px;"></div>
        </div>
        <button class="btn-primary" id="previewFloatingBtn" style="background:var(--cyan); color:#000;">معاينة القطرة السينمائية الآن 🎬</button>
      </section>

      <!-- 4. الاقتباسات (أقسام) -->
      <section class="view" id="libraryView">
        <h2 style="color:var(--cyan); margin-top:0;" data-i18n="quotes">اقتباسات</h2>
        <div id="categoriesContainer"></div>
      </section>

      <!-- 5. الإحصائيات -->
      <section class="view" id="statsView">
        <h2 style="color:var(--cyan); margin-top:0;" data-i18n="stats">إحصائيات التقدم 📈</h2>
        <div class="glass-panel">
          <div class="chart-container">
            <svg viewBox="0 0 100 50" preserveAspectRatio="none" style="width:100%; height:100%;">
              <polyline fill="none" stroke="#00e5ff" stroke-width="2" points="0,45 20,35 40,25 60,30 80,15 100,5" />
              <polygon fill="rgba(0,229,255,0.15)" points="0,50 0,45 20,35 40,25 60,30 80,15 100,5 100,50" />
            </svg>
          </div>
          <div style="font-size:15px; line-height:2.5;">
            <div>⏳ أيام الاستخدام: <span id="statDays">1</span></div>
            <div>🔔 الإشعارات: <span id="statNotifs">0</span></div>
            <div>💧 القطرات: <span id="statDrops">0</span></div>
          </div>
        </div>
      </section>
    </div>

    <!-- البار السفلي الاحترافي - الرئيسية في الوسط -->
    <nav class="bottom-nav">
      <!-- زر الاقتباسات (أيقونة علامتي تنصيص) -->
      <button class="nav-item" data-view="libraryView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zm10 0h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zM10 11l-2 6M20 11l-2 6"/></svg>
        <span data-i18n="quotes">اقتباسات</span>
      </button>
      <!-- زر تأمل (أيقونة لوتس) -->
      <button class="nav-item" data-view="meditationView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 16v-4m0-4h.01"/></svg>
        <span data-i18n="meditation">تأمل</span>
      </button>
      
      <!-- زر الرئيسية الدائري المميز في المنتصف -->
      <button class="nav-item nav-home-btn active" data-view="homeView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span data-i18n="home">الرئيسية</span>
      </button>

      <!-- زر إعدادات القطرة -->
      <button class="nav-item" data-view="settingsView">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span data-i18n="qatra_settings">القطرة</span>
      </button>
      <!-- زر الإحصائيات -->
      <button class="nav-item" data-view="statsView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span data-i18n="stats">إحصائيات</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
