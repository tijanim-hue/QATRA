<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#020409">
  <title data-i18n="app_title">Qatra</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020409; --surface: rgba(12, 18, 30, 0.6); --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff; --muted: #7b8ba4; 
      --cyan: #00e5ff; --blue: #0066ff; --purple: #a900ff;
    }
    
    body.glass-active {
      --surface: rgba(12, 18, 30, 0.35); --border: rgba(255, 255, 255, 0.15);
    }
    body.glass-active .glass-panel {
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    
    body.light-mode { --bg: #eef2f6; --surface: rgba(255, 255, 255, 0.8); --text: #020409; --border: rgba(0,0,0,0.1); --muted: #5a6b8c; }
    body.light-mode.glass-active { --surface: rgba(255,255,255,0.5); }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: var(--bg); color: var(--text); font-family: "Cairo", sans-serif;
      background-image: 
        radial-gradient(circle at 0% 20%, rgba(0, 229, 255, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 100% 60%, rgba(169, 0, 255, 0.12) 0%, transparent 50%);
      background-attachment: fixed; transition: background 0.4s ease;
    }

    .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; max-width: 500px; margin: auto; position: relative; }
    
    /* شاشة الإقلاع */
    #splash { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease; }
    .splash-drop { width: 80px; height: 80px; border-radius: 0 50% 50% 50%; background: linear-gradient(135deg, var(--cyan), var(--blue)); transform: rotate(45deg); animation: pulseDrop 2s infinite; }
    @keyframes pulseDrop { 0%, 100% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(45deg) scale(1.1); box-shadow: 0 0 40px rgba(0,229,255,0.6); } }

    /* Topbar */
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; padding: 25px 20px 10px; z-index: 10; }
    .hamburger { background: none; border: none; color: var(--text); padding: 0; cursor: pointer;}
    .hamburger svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 2.5; }
    
    .brand { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: -5px; }
    .brand-icon { width: 38px; height: 38px; margin-bottom: 5px; }
    .brand-name { font-size: 28px; font-weight: 900; line-height: 1; letter-spacing: 0.5px;}
    .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 5px; margin-top: 2px;}

    /* القائمة الجانبية */
    .sidebar { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(5, 8, 15, 0.9); backdrop-filter: blur(25px); border-left: 1px solid var(--border); z-index: 1000; transition: right 0.4s ease; padding: 30px 20px; display: flex; flex-direction: column; }
    .sidebar.open { right: 0; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .sidebar-overlay.show { opacity: 1; pointer-events: all; }

    /* منطقة المحتوى */
    .content-area { flex: 1; overflow-y: auto; padding: 10px 20px 110px; scroll-behavior: smooth; }
    .content-area::-webkit-scrollbar { display: none; }

    .glass-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 20px; margin-bottom: 20px; }

    /* حلقة البومودورو النيونية */
    .timer-wrapper {
      position: relative; width: 280px; height: 280px; margin: 10px auto 40px; border-radius: 50%; padding: 5px;
      background: conic-gradient(from 180deg, var(--cyan), var(--purple), var(--cyan));
      box-shadow: 0 0 50px rgba(169, 0, 255, 0.25); cursor: pointer;
    }
    .timer-inner {
      background: var(--bg); width: 100%; height: 100%; border-radius: 50%;
      display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
    }
    .time-display { font-size: 65px; font-weight: 900; letter-spacing: 1px; margin-top: -15px; }
    .timer-label { font-size: 15px; color: var(--muted); font-weight: 700; text-align: center; }
    
    .play-btn {
      position: absolute; bottom: 25px; width: 56px; height: 56px; border-radius: 50%; border: none;
      background: #d4ebff; color: #02050a; display: grid; place-items: center; pointer-events: none;
    }

    /* البطاقات المضيئة */
    .action-card { display: flex; align-items: center; gap: 18px; cursor: pointer; position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 22px 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
    .card-icon { width: 34px; height: 34px; color: var(--cyan); display: grid; place-items: center; }
    .card-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2.5; }
    .card-content { flex: 1; }
    .card-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 3px; }
    .card-subtitle { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .card-arrow { color: var(--muted); font-size: 22px; font-weight: bold; }

    /* البار السفلي الاحترافي */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; align-items: flex-end;
      padding: 10px 10px calc(15px + env(safe-area-inset-bottom));
      background: rgba(2, 4, 9, 0.95); backdrop-filter: blur(25px); border-top: 1px solid var(--border); border-radius: 40px 40px 0 0; z-index: 100;
    }
    .nav-item { border: none; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; cursor: pointer; }
    .nav-icon { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-item.active { color: #fff; }
    .nav-item.active .nav-icon { stroke: #fff; }
    
    /* زر الرئيسية المتوهج */
    .nav-home-btn {
      width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #182bb0, #a900ff);
      display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; border: none;
      box-shadow: 0 8px 25px rgba(169,0,255,0.45); transform: translateY(-15px); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 800;
    }
    .nav-home-btn .nav-icon { stroke: #fff; width: 30px; height: 30px; margin-bottom:3px;}

    .view { display: none; animation: fadeIn 0.3s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* أقسام الاقتباسات */
    .category-card { 
      border: 1px solid var(--border); border-radius: 24px; padding: 25px; 
      display: flex; align-items: center; gap: 20px; margin-bottom: 20px; cursor: pointer; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.2s;
    }
    .category-card:active { transform: scale(0.98); }
    .cat-emoji { font-size: 45px; }
    
    /* أدوات UI */
    .btn-primary { width: 100%; padding: 18px; border: none; border-radius: 18px; background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; margin-top:15px; box-shadow: 0 8px 25px rgba(0,229,255,0.3);}
    select, input[type="time"] { width: 100%; padding: 16px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid var(--border); border-radius: 16px; outline:none; margin-top:8px; font-family:inherit; font-size: 15px;}
    
    /* النوافذ المنبثقة */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; flex-direction: column; padding: 20px; backdrop-filter: blur(15px); }
    .modal-overlay.show { display: flex; }
    .close-modal { align-self: flex-start; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; margin-bottom: 15px; }

    /* مبيان الإحصائيات الخطي */
    .chart-container { width: 100%; height: 160px; background: rgba(0,0,0,0.3); border-radius: 16px; margin: 20px 0; position: relative; border-bottom: 3px solid var(--border); border-left: 3px solid var(--border); overflow: hidden; }
    
    /* مفاتيح التبديل */
    .toggle { width: 50px; height: 28px; position: relative; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; border-radius: 30px; background: rgba(255,255,255,0.1); transition: 0.3s; }
    .toggle-track::before { content: ""; position: absolute; width: 22px; height: 22px; right: 3px; top: 3px; border-radius: 50%; background: #fff; transition: 0.3s; }
    .toggle input:checked + .toggle-track { background: var(--cyan); }
    .toggle input:checked + .toggle-track::before { transform: translateX(-22px); }
  </style>
</head>
<body>
  <!-- شعار القطرة -->
  <svg width="0" height="0" style="position:absolute;">
    <defs><linearGradient id="drop-grad" x1="12" y1="2" x2="12" y2="21"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0066ff"/></linearGradient></defs>
  </svg>

  <div id="splash">
    <div class="splash-drop"></div>
    <h1 style="color:white; margin-top:35px; font-size:36px; font-weight:900;">Qatra</h1>
    <p style="color:#00e5ff; letter-spacing:5px; font-size:12px;">Q A T R A</p>
  </div>

  <!-- القائمة الجانبية -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <button id="closeSidebar" style="background:none; border:none; color:white; font-size:35px; text-align:left; margin-bottom:25px; cursor:pointer;">×</button>
    <div class="glass-panel" style="padding:18px; display:flex; justify-content:space-between; align-items:center;">
      <span data-i18n="glass_mode" style="font-size:16px; font-weight:700;">Glass Effect 💎</span>
      <label class="toggle"><input type="checkbox" id="glassToggle"><span class="toggle-track"></span></label>
    </div>
    <div class="glass-panel" style="padding:18px; display:flex; justify-content:space-between; align-items:center;">
      <span data-i18n="dark_mode" style="font-size:16px; font-weight:700;">Dark Mode 🌙</span>
      <label class="toggle"><input type="checkbox" id="darkToggle"><span class="toggle-track"></span></label>
    </div>
    <div style="margin-bottom:20px;">
      <label style="color:var(--muted); font-size:13px;" data-i18n="language">Language:</label>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </div>
    <button class="btn-primary" style="background:transparent; border:2px solid var(--cyan); color:var(--cyan); box-shadow:none;" data-i18n="share">Share App</button>
  </aside>

  <!-- نافذة البومودورو -->
  <div class="modal-overlay" id="pomodoroModal">
    <button class="close-modal" onclick="document.getElementById('pomodoroModal').classList.remove('show')">×</button>
    <h2 style="color:var(--cyan); margin-top:0; font-weight:800;">Focus Session</h2>
    <div class="glass-panel">
      <label style="color:var(--muted); font-size:14px;">Duration (Minutes):</label>
      <select id="pomoTime">
        <option value="15">15 Min</option>
        <option value="25" selected>25 Min (Pomodoro)</option>
        <option value="50">50 Min (Deep Focus)</option>
      </select>
    </div>
    <div class="glass-panel">
      <label style="color:var(--muted); font-size:14px;">Background Audio:</label>
      <select id="pomoAudio">
        <option value="none">No Sound (Silent)</option>
        <option value="https://actions.google.com/sounds/v1/water/rain_on_roof.ogg" selected>Rain Drops</option>
        <option value="https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg">Ocean Waves</option>
        <option value="https://server8.mp3quran.net/afs/001.mp3">Quran Recitation</option>
      </select>
    </div>
    <button class="btn-primary" id="startPomodoroBtn">Start Session</button>
  </div>

  <!-- نافذة محتوى القسم -->
  <div class="modal-overlay" id="quotesCategoryModal">
    <button class="close-modal" onclick="document.getElementById('quotesCategoryModal').classList.remove('show')">×</button>
    <h2 style="color:var(--cyan); margin-top:0; font-weight:800;" id="catModalTitle">Category</h2>
    <div style="flex:1; overflow-y:auto; margin-bottom:20px;" id="catModalContent"></div>
  </div>

  <div class="app-container">
    <header class="topbar">
      <div style="width:32px;"></div> <!-- للحفاظ على التوسيط -->
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 12 2 12 2C12 2 3 7.02944 3 12C3 16.9706 7.02944 21 12 21Z" fill="url(#drop-grad)"/></svg>
        <div class="brand-name" data-i18n="app_title">Qatra</div>
        <div class="brand-sub">Q A T R A</div>
      </div>
      <button class="hamburger" id="openSidebar"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    </header>

    <div class="content-area">
      <!-- 1. الرئيسية -->
      <section class="view active" id="homeView">
        <div class="timer-wrapper" onclick="document.getElementById('pomodoroModal').classList.add('show')">
          <div class="timer-inner">
            <div class="time-display" id="mainTimeDisplay">25:00</div>
            <div class="timer-label" data-i18n="focus_session">Focus & Calm</div>
            <button class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          </div>
        </div>

        <div class="action-card" onclick="document.querySelector('[data-view=\'settingsView\']').click()">
          <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
          <div class="card-content">
            <div class="card-title" data-i18n="upcoming_reminders">Upcoming</div>
            <div class="card-subtitle" id="nextReminderText">No schedules set</div>
          </div>
          <div class="card-arrow">›</div>
        </div>

        <div class="action-card" id="triggerCinematic">
          <div class="card-icon" style="color:var(--purple);"><svg viewBox="0 0 24 24"><path d="M10 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zm10 0h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zM10 11l-2 6M20 11l-2 6"/></svg></div>
          <div class="card-content">
            <div class="card-title" data-i18n="quote_of_day">Daily Quote</div>
            <div class="card-subtitle" id="dailyQuoteText">...</div>
          </div>
          <div class="card-arrow">›</div>
        </div>
      </section>

      <!-- 2. تأمل -->
      <section class="view" id="meditationView">
        <h2 style="color:var(--cyan); margin-top:0; font-weight:900;" data-i18n="meditation">Meditate</h2>
        <div class="glass-panel" style="text-align:center; padding:50px 20px;">
          <div id="audioStatus" style="font-size:18px; margin-bottom:25px; font-weight:800;">Ready to Relax</div>
          <button class="btn-primary" id="playRandomAudioBtn">▶ Play Random Audio</button>
        </div>
      </section>

      <!-- 3. القطرة (الإعدادات) -->
      <section class="view" id="settingsView">
        <h2 style="color:var(--cyan); margin-top:0; font-weight:900;" data-i18n="qatra_settings">Drop</h2>
        
        <div class="glass-panel">
          <label style="color:var(--muted); font-size:14px;" data-i18n="drop_mode">Notification Mode:</label>
          <select id="notifModeSetting">
            <option value="both" data-i18n="mode_both">Cinematic Drop + Text Notification</option>
            <option value="floating" data-i18n="mode_floating">Cinematic Drop Only</option>
            <option value="notification" data-i18n="mode_notif">Text Notification Only</option>
          </select>
          
          <label style="color:var(--muted); font-size:14px; display:block; margin-top:20px;" data-i18n="drop_duration">Drop Duration:</label>
          <select id="dropDurationSetting">
            <option value="5000">5 Seconds</option>
            <option value="10000" selected>10 Seconds</option>
            <option value="15000">15 Seconds</option>
          </select>

          <label style="color:var(--muted); font-size:14px; display:block; margin-top:20px;" data-i18n="drop_interval">Auto Repeat Interval:</label>
          <select id="intervalSelect">
            <option value="0" data-i18n="no_repeat">No Repeat</option>
            <option value="30">Every 30 Mins</option>
            <option value="60">Every 1 Hour</option>
            <option value="180">Every 3 Hours</option>
          </select>

          <div style="margin-top:25px; border-top:1px solid var(--border); padding-top:20px;">
            <label style="color:var(--muted); font-size:14px;" data-i18n="custom_time">Set Specific Time:</label>
            <input type="time" id="customTime">
            <button class="btn-primary" id="saveScheduleBtn" style="margin-top:15px;" data-i18n="save_time">Save Time</button>
          </div>
          <div id="savedSchedulesList" style="margin-top:20px;"></div>
        </div>
        <button class="btn-primary" id="previewFloatingBtn" style="background:var(--cyan); color:#000;" data-i18n="preview_drop">Preview Cinematic Drop 🎬</button>
      </section>

      <!-- 4. الاقتباسات (أقسام) -->
      <section class="view" id="libraryView">
        <h2 style="color:var(--cyan); margin-top:0; font-weight:900;" data-i18n="quotes">Quotes</h2>
        <div id="categoriesContainer" style="margin-top:20px;"></div>
      </section>

      <!-- 5. الإحصائيات -->
      <section class="view" id="statsView">
        <h2 style="color:var(--cyan); margin-top:0; font-weight:900;" data-i18n="stats">Stats</h2>
        <div class="glass-panel">
          <div class="chart-container">
            <svg viewBox="0 0 100 50" preserveAspectRatio="none" style="width:100%; height:100%;">
              <polyline fill="none" stroke="#00e5ff" stroke-width="2.5" points="0,45 20,30 40,35 60,15 80,20 100,5" />
              <polygon fill="rgba(0,229,255,0.15)" points="0,50 0,45 20,30 40,35 60,15 80,20 100,5 100,50" />
            </svg>
          </div>
          <div style="font-size:16px; line-height:2.8; font-weight:700;">
            <div>⏳ <span data-i18n="stat_days">Active Days:</span> <span id="statDays" style="float:inline-end;">1</span></div>
            <div>🔔 <span data-i18n="stat_notifs">Notifications:</span> <span id="statNotifs" style="float:inline-end;">0</span></div>
            <div>💧 <span data-i18n="stat_drops">Drops:</span> <span id="statDrops" style="float:inline-end;">0</span></div>
          </div>
        </div>
      </section>
    </div>

    <!-- البار السفلي الاحترافي - مطابقة الصور -->
    <nav class="bottom-nav">
      <!-- 1. اقتباسات -->
      <button class="nav-item" data-view="libraryView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zm10 0h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zM10 11l-2 6M20 11l-2 6"/></svg>
        <span data-i18n="quotes">Quotes</span>
      </button>
      
      <!-- 2. تأمل -->
      <button class="nav-item" data-view="meditationView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zm0-2a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-3-5a3 3 0 1 0 6 0 3 3 0 0 0-6 0z"/></svg>
        <span data-i18n="meditation">Meditate</span>
      </button>
      
      <!-- 3. الرئيسية المتوهجة في المنتصف -->
      <button class="nav-item nav-home-btn active" data-view="homeView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span data-i18n="home">Home</span>
      </button>

      <!-- 4. القطرة (إعدادات) -->
      <button class="nav-item" data-view="settingsView">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span data-i18n="qatra_settings">Drop</span>
      </button>
      
      <!-- 5. الإحصائيات -->
      <button class="nav-item" data-view="statsView">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span data-i18n="stats">Stats</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
