<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080e1c">
  <meta name="description" content="قطرة - لحظة وعي وهدوء وأذكار في يومك">
  <title>قطرة | QATRA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080e1c;
      --surface: #111a2d;
      --surface-2: #17233a;
      --border: rgba(255,255,255,.08);
      --text: #f4f7ff;
      --muted: #8d9bb7;
      --blue: #67c8ff;
      --cyan: #7be7e8;
      --purple: #9b8cff;
      --green: #78e6bd;
      --danger: #ff879b;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* تأثير الزجاج (Glassmorphism) */
    body.glass-effect .app,
    body.glass-effect .reminder-card,
    body.glass-effect .category-card,
    body.glass-effect .setting-row,
    body.glass-effect .modal {
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 560px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px 110px;
      background: var(--bg);
      transition: background 0.3s ease;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(145deg, #183c69, #10223d);
      border: 1px solid rgba(103,200,255,.22);
      box-shadow: 0 8px 28px rgba(32,126,215,.15);
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
      letter-spacing: .5px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--text);
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: background 0.2s;
    }

    .icon-button:active {
      transform: scale(0.95);
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
    }

    .welcome {
      margin-bottom: 22px;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.6;
      font-weight: 800;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      margin: 6px 0 0;
      line-height: 1.9;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 28px 22px 24px;
      text-align: center;
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 25%, rgba(89,174,255,.18), transparent 45%),
        linear-gradient(155deg, #152642, #10192c 65%, #11182b);
      border: 1px solid rgba(130,190,255,.12);
      box-shadow: 0 20px 50px rgba(0,0,0,.16);
    }

    .hero-label {
      position: relative;
      color: #a8c9ed;
      font-size: 12px;
      font-weight: 600;
    }

    .drop-stage {
      position: relative;
      height: 220px;
      display: grid;
      place-items: center;
      margin: 15px 0;
    }

    /* شكل القطرة الزجاجية 3D */
    .drop {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      background: linear-gradient(135deg, rgba(255,255,255,.6) 0%, rgba(128,224,255,.7) 30%, rgba(42,117,211,.9) 100%);
      box-shadow: inset 10px 15px 25px rgba(255,255,255,.9), 0 20px 35px rgba(0,0,0,.4);
      animation: morphDrop 4s ease-in-out infinite;
    }

    /* شكل البيضة المتكسرة */
    .egg {
      position: relative;
      width: 100px;
      height: 130px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: linear-gradient(135deg, #fff7e6 0%, #ffd180 50%, #f57c00 100%);
      box-shadow: inset -10px -15px 25px rgba(150, 75, 0, 0.4), 0 15px 30px rgba(0,0,0,0.3);
    }
    .egg .crack {
      position: absolute;
      top: 45%;
      left: 30%;
      width: 40px;
      height: 2px;
      background: #3e2723;
      transform: rotate(25deg);
    }

    @keyframes morphDrop {
      0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
      50% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
    }

    .drop-ring {
      position: absolute;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(119,205,255,.15);
      border-radius: 50%;
      animation: pulse 4s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(.85); opacity: .4; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .quote {
      position: relative;
      font-size: 17px;
      font-weight: 700;
      line-height: 2;
      margin: 12px auto 8px;
      max-width: 390px;
      min-height: 72px;
    }

    .quote-author {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 20px;
    }

    .primary-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 17px;
      color: #061222;
      font-weight: 800;
      font-size: 14px;
      background: linear-gradient(100deg, #8ce8e6, #76c9ff);
      box-shadow: 0 10px 28px rgba(83,192,255,.15);
    }

    .secondary-button {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.035);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }

    .section { margin-top: 28px; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-heading h2 { font-size: 16px; margin: 0; font-weight: 800; }

    .text-button { border: 0; background: transparent; color: var(--blue); font-size: 12px; font-weight: 700; }

    .reminder-card, .schedule-item, .setting-row {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      margin-bottom: 10px;
    }

    .reminder-info, .setting-info { flex: 1; min-width: 0; }
    .reminder-title, .setting-title { font-size: 13px; font-weight: 700; }
    .reminder-sub, .setting-description { color: var(--muted); font-size: 11px; margin-top: 4px; }

    .toggle { width: 45px; height: 26px; position: relative; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; border-radius: 30px; background: #354159; transition: .25s; }
