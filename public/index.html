<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1224">
  <meta name="description" content="قطرة - لحظة وعي وهدوء وأذكار في يومك">
  <title>قطرة | QATRA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* اللون الأزرق الداكن الأساسي */
      --bg: #0a1224;
      --surface: rgba(17, 28, 51, 0.6);
      --border: rgba(255, 255, 255, 0.05);
      --text: #ffffff;
      --blue: #4da6ff;
      --cyan: #7be7e8;
      --glass-blur: blur(18px);
    }
    /* الوضع الداكن (أسود غامق جداً) */
    body.dark-mode {
      --bg: #030508;
      --surface: rgba(10, 15, 25, 0.5);
      --border: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(circle at 15% 50%, rgba(77, 166, 255, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(123, 231, 232, 0.05), transparent 25%);
      color: var(--text); font-family: "Cairo", sans-serif;
      transition: background 0.4s ease; overflow-x: hidden;
    }

    .app { max-width: 560px; margin: auto; padding: 22px 18px 110px; }

    /* تأثير الزجاج الاحترافي (Glassmorphism) */
    .glass-panel {
      background: var(--surface);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* الـ Topbar والقائمة */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .hamburger { background: transparent; border: none; color: var(--text); font-size: 28px; cursor: pointer; padding: 5px; }
    
    .brand-icon {
      width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px;
      background: linear-gradient(135deg, #183c69, #0a1224); border: 1px solid rgba(103,200,255,.2);
    }
    
    /* القائمة الجانبية (Sidebar) */
    .sidebar {
      position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
      background: rgba(8, 14, 28, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-left: 1px solid rgba(255,255,255,0.05); z-index: 999;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 40px 20px; display: flex; flex-direction: column;
    }
    .sidebar.open { right: 0; }
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sidebar-overlay.show { opacity: 1; pointer-events: all; }
    .sidebar-close { align-self: flex-start; background: none; border: none; color: #fff; font-size: 30px; margin-bottom: 30px; }
    .sidebar-menu { display: flex; flex-direction: column; gap: 15px; flex: 1; }
    .menu-item { background: none; border: none; color: #fff; font-size: 16px; font-weight: 600; text-align: right; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 15px; font-family: inherit;}
    .sidebar-footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: auto; }
    .developer-name { color: var(--cyan); font-weight: bold; letter-spacing: 1px; font-size: 13px; margin-top: 5px;}

    /* القطرة العمودية الاحترافية */
    .hero { text-align: center; padding: 40px 20px; position: relative; overflow: hidden; margin-bottom: 25px; }
    .drop-stage { position: relative; height: 180px; display: grid; place-items: center; margin: 10px 0; }
    .drop-vertical {
      width: 100px; height: 100px;
      /* زاوية حادة في الأعلى لتعطي شكل قطرة مائية عمودية */
      border-radius: 0 50% 50% 50%; 
      transform: rotate(45deg);
      background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(123,231,232,0.6) 50%, rgba(77,166,255,0.9) 100%);
      box-shadow: inset 10px 10px 20px rgba(255,255,255,0.5), 0 15px 35px rgba(0,100,255,0.3);
      animation: floatDrop 4s ease-in-out infinite;
    }
    @keyframes floatDrop { 0%, 100% { transform: translateY(0) rotate(45deg); } 50% { transform: translateY(-12px) rotate(45deg); } }

    /* النصوص والأزرار */
    .quote { font-size: 18px; font-weight: 700; line-height: 1.8; margin: 15px 0; }
    .primary-button { width: 100%; padding: 16px; border: 0; border-radius: 18px; color: #000; font-weight: 800; font-size: 15px; background: linear-gradient(100deg, #7be7e8, #4da6ff); box-shadow: 0 10px 25px rgba(77,166,255,0.25); transition: transform 0.2s; }
    .primary-button:active { transform: scale(0.96); }
    
    .section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .reminder-card { display: flex; align-items: center; gap: 15px; padding: 18px; margin-bottom: 12px; }
    
    .toggle { width: 45px; height: 26px; position: relative; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; border-radius: 30px; background: rgba(255,255,255,0.1); transition: .3s; }
    .toggle-track::before { content: ""; position: absolute; width: 20px; height: 20px; right: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .3s; }
    .toggle input:checked + .toggle-track { background: var(--blue); }
    .toggle input:checked + .toggle-track::before { transform: translateX(-19px); }

    .bottom-nav {
      position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px;
      display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
    }
    .nav-item { border: none; background: transparent; color: #75839f; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .nav-item.active { color: var(--blue); }
    .nav-item svg { width: 22px; height: 22px; }

    .view { display: none; animation: fadeIn 0.4s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    select { width: 100%; padding: 14px; background: rgba(0,0,0,0.2); color: #fff; border: 1px solid var(--border); border-radius: 14px; outline: none; font-family: inherit; }
    option { background: var(--bg); }
  </style>
</head>
<body>

  <!-- القائمة الجانبية (Hamburger Menu) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="closeSidebar">×</button>
    <div class="sidebar-menu">
      <button class="menu-item" id="btnLang">🌐 لغة التطبيق (العربية)</button>
      <button class="menu-item" id="btnShare">📤 مشاركة مع صديق</button>
      <button class="menu-item" id="btnAbout">💡 حول قطرة</button>
      <button class="menu-item" id="btnPrivacy">🛡️ سياسة الخصوصية</button>
    </div>
    <div class="sidebar-footer">
      <div>الإصدار 1.0.0 (النسخة السينمائية)</div>
      <div class="developer-name">Developed by<br>Mohammed Tijani</div>
    </div>
  </aside>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="#7be7e8" stroke-width="2" fill="none"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
        <div><div style="font-size:18px;font-weight:800;">قطرة</div><div style="font-size:10px;color:#8d9bb7;">QATRA</div></div>
      </div>
      <button class="hamburger" id="openSidebar">☰</button>
    </header>

    <section class="view active" id="homeView">
      <section class="hero glass-panel">
        <div style="color:var(--cyan);font-size:12px;font-weight:700;">لحظة لك أنت</div>
        <div class="drop-stage"><div class="drop-vertical"></div></div>
        <div class="quote" id="dailyQuote">خذ نفسًا من الهدوء والأذكار.</div>
        <button class="primary-button" id="showDrop">أرسل لي قطرة الآن ✦</button>
      </section>
      
      <section class="glass-panel reminder-card" style="margin-top:20px;">
        <div style="flex:1;">
          <div style="font-weight:700;">تفعيل التذكيرات</div>
          <div style="font-size:11px;color:var(--cyan);">المواعيد السينمائية</div>
        </div>
        <label class="toggle"><input type="checkbox" id="remindersEnabled"><span class="toggle-track"></span></label>
      </section>
    </section>

    <!-- الإعدادات -->
    <section class="view" id="settingsView">
      <h2 style="margin-bottom:20px;">الإعدادات</h2>
      
      <div class="glass-panel reminder-card">
        <div style="flex:1;"><div style="font-weight:700;">الوضع الداكن (العميق)</div></div>
        <label class="toggle"><input type="checkbox" id="darkModeSetting"><span class="toggle-track"></span></label>
      </div>

      <div class="glass-panel reminder-card">
        <div style="flex:1;">
          <div style="font-weight:700;">نوع المحتوى (أذكار / عبارات)</div>
          <select id="contentTypeSetting" style="margin-top:10px;">
            <option value="all">عشوائي منوع</option>
            <option value="dhikr">أذكار وأدعية إسلامية</option>
            <option value="quotes">عبارات تحفيزية</option>
          </select>
        </div>
      </div>

      <button class="primary-button" id="previewFloating" style="margin-top:20px;">معاينة التأثير السينمائي الخارجي 🎬</button>
    </section>
  </main>

  <nav class="bottom-nav glass-panel" style="border-radius:24px 24px 0 0;">
    <button class="nav-item active" data-view="homeView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>الرئيسية</button>
    <button class="nav-item" data-view="settingsView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>الإعدادات</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
