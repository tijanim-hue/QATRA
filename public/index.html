<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030612">
  <title>قطرة | QATRA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040814;
      --card-bg: #0d1627;
      --text: #ffffff;
      --muted: #7b8ba4;
      --cyan: #00e5ff;
      --purple: #a900ff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
    }

    /* الخلفية المتموجة النيونية */
    .app-bg {
      position: absolute; inset: 0; z-index: -1;
      background: 
        radial-gradient(circle at 10% 60%, rgba(0, 229, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 30%, rgba(169, 0, 255, 0.12) 0%, transparent 40%);
    }

    .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; max-width: 500px; margin: auto; position: relative; }

    /* الشريط العلوي */
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; padding: 25px 20px 10px; z-index: 10; }
    .icon-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 0; display: grid; place-items: center;}
    .icon-btn svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; }
    
    .brand { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: -5px; }
    .brand-icon { width: 36px; height: 36px; margin-bottom: 5px; }
    .brand-name { font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: 0.5px;}
    .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 4px; margin-top: 2px;}

    /* منطقة المحتوى */
    .content-area { flex: 1; overflow-y: auto; padding: 10px 0 100px; scroll-behavior: smooth; }
    .content-area::-webkit-scrollbar { display: none; }

    /* المؤقت الدائري */
    .timer-wrapper {
      position: relative; width: 270px; height: 270px; margin: 25px auto 40px;
      border-radius: 50%; padding: 4px;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 100%);
      box-shadow: 0 0 40px rgba(169, 0, 255, 0.15);
    }
    .timer-inner {
      background: var(--bg); width: 100%; height: 100%; border-radius: 50%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative;
    }
    .time-display { font-size: 58px; font-weight: 800; letter-spacing: 1px; margin-top: -10px; }
    .timer-label { font-size: 15px; color: var(--muted); font-weight: 700; line-height: 1.4; text-align: center; margin-top: -5px; }
    
    .play-btn {
      position: absolute; bottom: 25px; width: 54px; height: 54px; border-radius: 50%; border: none;
      background: #c7e3ff; color: #040814; display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3); transition: transform 0.2s;
    }
    .play-btn:active { transform: scale(0.95); }
    .play-btn svg { width: 22px; height: 22px; margin-left: 4px; fill: currentColor; }

    /* البطاقات */
    .card-container { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
    .action-card {
      background: var(--card-bg); border-radius: 24px; padding: 22px 20px;
      display: flex; align-items: center; gap: 18px; cursor: pointer;
      position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    /* التوهج العلوي للبطاقة */
    .action-card::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 40px; height: 3px; background: var(--cyan); border-radius: 0 0 5px 5px;
      box-shadow: 0 0 15px var(--cyan); opacity: 0.8;
    }
    
    .card-icon { width: 32px; height: 32px; color: var(--cyan); display: grid; place-items: center; }
    .card-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;}
    .card-content { flex: 1; }
    .card-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .card-subtitle { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .card-arrow { color: var(--muted); font-size: 20px; font-weight: bold; }

    /* البار السفلي المطابق للصورة */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
      background: rgba(4, 8, 20, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.03); border-radius: 35px 35px 0 0; z-index: 100;
    }
    .nav-item {
      border: none; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700;
      display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; cursor: pointer;
    }
    .nav-icon-wrapper { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; transition: 0.3s; margin-bottom: 2px;}
    .nav-item.active { color: #fff; }
    .nav-item.active .nav-icon-wrapper { background: linear-gradient(135deg, #182bb0, #a900ff); box-shadow: 0 5px 20px rgba(169,0,255,0.4); }
    .nav-item svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.active svg { stroke: #fff; }

    /* القوائم الأخرى (تأمل، إعدادات، اقتباسات) مخفية افتراضياً وتظهر عند الطلب */
    .view { display: none; animation: fadeIn 0.3s ease; padding: 20px;}
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

    /* تنسيقات الإعدادات (نفس الوظائف السابقة بتصميم أنيق) */
    .settings-card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
    .toggle { width: 46px; height: 26px; position: relative; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; border-radius: 30px; background: rgba(255,255,255,0.1); transition: 0.3s; }
    .toggle-track::before { content: ""; position: absolute; width: 20px; height: 20px; right: 3px; top: 3px; border-radius: 50%; background: #fff; transition: 0.3s; }
    .toggle input:checked + .toggle-track { background: var(--cyan); }
    .toggle input:checked + .toggle-track::before { transform: translateX(-20px); }
    .btn-primary { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px;}
    select { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-top: 10px; outline:none; }

  </style>
</head>
<body>

  <!-- الشعار التدرجي -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="drop-grad" x1="12" y1="2" x2="12" y2="21">
        <stop offset="0%" stop-color="#00e5ff"/>
        <stop offset="100%" stop-color="#0066ff"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="app-bg"></div>

  <div class="app-container">
    <!-- الشريط العلوي -->
    <header class="topbar">
      <!-- الجرس على اليمين (لأن الاتجاه RTL، العنصر الأول يظهر يميناً) -->
      <button class="icon-btn" aria-label="الإشعارات">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 12 2 12 2C12 2 3 7.02944 3 12C3 16.9706 7.02944 21 12 21Z" fill="url(#drop-grad)"/>
        </svg>
        <div class="brand-name">قطرة</div>
        <div class="brand-sub">Q A T R A</div>
      </div>

      <!-- الهامبرغر على اليسار -->
      <button class="icon-btn" aria-label="القائمة">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </header>

    <div class="content-area">
      <!-- 1. الشاشة الرئيسية (Home) -->
      <section class="view active" id="homeView">
        
        <!-- المؤقت الدائري -->
        <div class="timer-wrapper">
          <div class="timer-inner">
            <div class="time-display" id="timerDisplay">25:00</div>
            <div class="timer-label">جلسة تركيز<br>وهدوء</div>
            <button class="play-btn" id="timerPlayBtn">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
        </div>

        <!-- البطاقات -->
        <div class="card-container">
          <!-- بطاقة التذكيرات -->
          <div class="action-card" onclick="document.querySelector('[data-view=\'settingsView\']').click()">
            <div class="card-icon">
              <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <div class="card-content">
              <div class="card-title">تذكيراتك القادمة</div>
              <div class="card-subtitle">اليوم 18:00</div>
            </div>
            <div class="card-arrow">›</div>
          </div>

          <!-- بطاقة الاقتباس -->
          <div class="action-card" id="triggerCinematic">
            <div class="card-icon">
              <!-- أيقونة علامتي التنصيص المزدوجة -->
              <svg viewBox="0 0 24 24"><path d="M10 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zm10 0h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4v6zM10 11l-2 6M20 11l-2 6"/></svg>
            </div>
            <div class="card-content">
              <div class="card-title">اقتباس اليوم</div>
              <div class="card-subtitle" id="dailyQuoteText">"كل يوم فرصة جديدة..."</div>
            </div>
            <div class="card-arrow">›</div>
          </div>
        </div>

      </section>

      <!-- 2. تأمل (جلسات) -->
      <section class="view" id="meditationView">
        <h2 style="margin-top:0; color:var(--cyan);">جلسات تأمل</h2>
        <div class="settings-card" style="text-align:center; padding:40px 20px;">
          <div id="audioStatus" style="font-size:16px; margin-bottom:20px; font-weight:bold;">استمع لأصوات الطبيعة والقرآن</div>
          <button class="btn-primary" id="playAudioBtn">▶ تشغيل عشوائي</button>
        </div>
      </section>

      <!-- 3. الأدوات (الإعدادات) -->
      <section class="view" id="settingsView">
        <h2 style="margin-top:0; color:var(--cyan);">تخصيص قطرة</h2>
        
        <div class="settings-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <span style="font-weight:700;">تفعيل الإشعارات والتنبيهات</span>
            <label class="toggle"><input type="checkbox" id="notifToggle" checked><span class="toggle-track"></span></label>
          </div>
          <div>
            <label style="color:var(--muted); font-size:13px;">تكرار الإشعارات التلقائي:</label>
            <select id="intervalSelect">
              <option value="0">بدون تكرار</option>
              <option value="30">كل نصف ساعة</option>
              <option value="60">كل ساعة</option>
              <option value="180">كل 3 ساعات</option>
            </select>
          </div>
        </div>

        <button class="btn-primary" id="previewFloatingBtn">معاينة القطرة السينمائية 🎬</button>
      </section>

      <!-- 4. الاقتباسات -->
      <section class="view" id="libraryView">
        <h2 style="margin-top:0; color:var(--cyan);">المكتبة</h2>
        <div class="settings-card">
          <p style="color:var(--muted); font-size:13px;">اختر ما تود ظهوره مع القطرة:</p>
          <div id="quotesList" style="display:grid; gap:15px; margin-top:15px;"></div>
        </div>
      </section>
    </div>

    <!-- الشريط السفلي المطابق تماماً للصورة -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="homeView">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
        الرئيسية
      </button>
      <button class="nav-item" data-view="meditationView">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zm0-2a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-3-5a3 3 0 1 0 6 0 3 3 0 0 0-6 0z"/></svg>
        </div>
        جلسات
      </button>
      <button class="nav-item" data-view="settingsView">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        الأدوات
      </button>
      <button class="nav-item" data-view="libraryView">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        اقتباسات
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
