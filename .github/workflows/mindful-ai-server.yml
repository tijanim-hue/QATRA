name: Mindful AI server source checks
on:
  push:
    branches: ["mindful/phase-2-ai"]
    paths: ["server/**", ".github/workflows/mindful-ai-server.yml"]
  pull_request:
    branches: [main]
    paths: ["server/**", ".github/workflows/mindful-ai-server.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned server dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check server syntax
        run: npm run check
      - name: Resolve handler imports without calling a provider
        run: node --input-type=module -e "await import('./api/mindful.js'); await import('./api/health.js')"
      - name: Preserve generated dependency lock for review
        uses: actions/upload-artifact@v4
        with:
          name: qatra-ai-server-dependency-lock
          path: server/package-lock.json
