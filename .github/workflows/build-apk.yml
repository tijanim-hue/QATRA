name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore persistent QATRA debug signing key
        shell: bash
        env:
          QATRA_DEBUG_KEYSTORE_B64: ${{ secrets.QATRA_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${QATRA_DEBUG_KEYSTORE_B64}" ]; then
            echo "Missing QATRA_DEBUG_KEYSTORE_B64 repository secret. Refusing to generate a new key."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$QATRA_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qatra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
