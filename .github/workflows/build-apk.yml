name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/mindful/phase-2-ai'
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore the existing signing key without generating a replacement
        shell: bash
        env:
          QATRA_DEBUG_KEYSTORE_B64: ${{ secrets.QATRA_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${QATRA_DEBUG_KEYSTORE_B64}" ]; then
            echo "Persistent signing key missing. Build blocked."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$QATRA_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Match the installed-reference certificate and assign increasing version code
        run: python3 scripts/build-identity.py prepare

      - name: Install Dependencies
        run: npm install

      - name: Prepare QATRA interface and experience
        run: |
          python3 scripts/prepare-theme-assets.py
          python3 scripts/prepare-theme-scroll.py
          python3 scripts/prepare-theme-refinements.py
          python3 scripts/prepare-navigation.py
          python3 scripts/prepare-global-navigation.py
          python3 scripts/prepare-experience-polish.py
          python3 scripts/prepare-drop-defaults.py
          python3 scripts/prepare-header-drop.py

      - name: Upload theme dimensions report
        uses: actions/upload-artifact@v4
        with:
          name: qatra-theme-dimensions
          path: theme-assets-report.json

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Block publication unless the actual APK matches the pinned identity
        run: python3 scripts/build-identity.py verify

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qatra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload public build identity report
        uses: actions/upload-artifact@v4
        with:
          name: qatra-build-identity
          path: qatra-build-identity.json
